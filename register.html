<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Admin - Manajemen Peternakan Puyuh</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="login-header">
                <img src="./assets/logo.png" alt="Puyuh Farm Logo" class="auth-logo">
                <h2 style="margin-bottom: 0.5rem; color: white;">Daftar Akun Baru</h2>
                <p style="color: var(--dim-text);">Buat akun admin peternakan</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Nama Lengkap</label>
                    <div style="position: relative;">
                        <input type="text" id="fullname" class="form-input" placeholder="Nama Lengkap" required style="padding-left: 2.5rem;">
                        <i class="fas fa-id-card" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div style="position: relative;">
                        <input type="email" id="email" class="form-input" placeholder="email@contoh.com" required style="padding-left: 2.5rem;">
                        <i class="fas fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" class="form-input" placeholder="Minimal 6 karakter" required minlength="6" style="padding-left: 2.5rem;">
                        <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                    </div>
                </div>

                <div id="error-msg" style="color: var(--error-color); font-size: 0.875rem; margin-bottom: 1rem; display: none;"></div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">DAFTAR SEKARANG</button>
            </form>
            
            <div class="text-center mt-3">
                <span style="color: #666;">Sudah punya akun? </span>
                <a href="login.html" style="color: var(--primary-color); font-weight: 600;">Login disini</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        window.onerror = function(msg, url, line, col, error) {
            alert("Global Error: " + msg + "\nIn: " + url + "\nLine: " + line);
            return false;
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/app.js?v=2"></script>
    <script>
        window.onload = function() {
            if (typeof Auth === 'undefined') {
                const errorMsg = 'CRITICAL: "Auth" class is not defined. \n\nPossibilities:\n1. js/app.js failed to load (Check Network Tab)\n2. js/app.js has a syntax error (Check Console)\n3. js/config.js is missing or invalid';
                console.error(errorMsg);
                alert(errorMsg);
                document.getElementById('error-msg').innerText = "System Error: Failed to load Application Logic.";
                document.getElementById('error-msg').style.display = 'block';
                document.querySelector('button[type="submit"]').disabled = true;
                return;
            }

            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fullName = document.getElementById('fullname').value;
                const email = document.getElementById('email').value;
                const pass = document.getElementById('password').value;
                
                const errorDiv = document.getElementById('error-msg');
                const submitBtn = e.target.querySelector('button[type="submit"]');

                // Reset error
                errorDiv.style.display = 'none';
                submitBtn.disabled = true;
                submitBtn.innerText = 'MEMPROSES...';

                try {
                    const success = await Auth.register(email, pass, fullName);
                    if (success) {
                        alert('Registrasi berhasil! Silakan tunggu persetujuan Admin sebelum bisa login.');
                        window.location.href = 'login.html';
                    }
                } catch (err) {
                    console.error(err);
                    let msg = err.message;
                    
                    if (msg.includes('rate limit')) {
                        // Styled Alert for Rate Limit
                        errorDiv.innerHTML = `
                            <div style="background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(220, 38, 38, 0.5); padding: 1rem; border-radius: 12px; display: flex; gap: 12px; align-items: flex-start; text-align: left;">
                                <i class="fas fa-shield-alt" style="color: #EF5350; font-size: 1.5rem; margin-top: 2px;"></i>
                                <div>
                                    <h4 style="color: #EF5350; margin: 0 0 5px 0; font-weight: 600;">Akses Dibatasi Sementara</h4>
                                    <p style="color: #e5e7eb; font-size: 0.85rem; margin: 0; line-height: 1.4;">
                                        Sistem keamanan mendeteksi terlalu banyak percobaan pendaftaran dari email/device ini.
                                    </p>
                                    <div style="margin-top: 8px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px;">
                                        <p style="color: #4ADE80; font-size: 0.85rem; margin: 0; font-weight: 500;">
                                            <i class="fas fa-lightbulb"></i> Solusi:
                                        </p>
                                        <p style="color: #9ca3af; font-size: 0.8rem; margin: 4px 0 0 0;">
                                            Gunakan <b>alamat email yang berbeda</b> untuk mendaftar sekarang.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        // Standard Error
                        errorDiv.innerHTML = `
                            <div style="background: rgba(220, 38, 38, 0.1); border: 1px solid #ef4444; padding: 0.8rem; border-radius: 8px; color: #fca5a5; display: flex; align-items: center; gap: 8px;">
                                <i class="fas fa-exclamation-circle"></i>
                                <span>${err.message}</span>
                            </div>
                        `;
                    }
                    errorDiv.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'DAFTAR SEKARANG';
                }
            });
        };
    </script>
</body>
</html>
