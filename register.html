<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Admin - Manajemen Peternakan Puyuh</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script type="module" crossorigin src="./assets/register-DKyAFw-a.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/config-_HLYuJBG.js">
  <link rel="modulepreload" crossorigin href="./assets/app-BgDMR-5F.js">
  <link rel="stylesheet" crossorigin href="./assets/style-D39I2b9w.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="login-header">
                <img src="./assets/logo-BuNsA154.png" alt="Puyuh Farm Logo" class="auth-logo">
                <h2 style="margin-bottom: 0.5rem; color: white;">Daftar Akun Baru</h2>
                <p style="color: var(--dim-text);">Buat akun admin peternakan</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Nama Lengkap</label>
                    <div style="position: relative;">
                        <input type="text" id="fullname" class="form-input" placeholder="Nama Lengkap" required style="padding-left: 2.5rem;">
                        <i class="fas fa-id-card" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div style="position: relative;">
                        <input type="email" id="email" class="form-input" placeholder="email@contoh.com" required style="padding-left: 2.5rem;">
                        <i class="fas fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" class="form-input" placeholder="Minimal 6 karakter" required minlength="6" style="padding-left: 2.5rem;">
                        <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                    </div>
                </div>

                <div id="error-msg" style="color: var(--error-color); font-size: 0.875rem; margin-bottom: 1rem; display: none;"></div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">DAFTAR SEKARANG</button>
            </form>
            
            <div class="text-center mt-3">
                <span style="color: #666;">Sudah punya akun? </span>
                <a href="login.html" style="color: var(--primary-color); font-weight: 600;">Login disini</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        window.onerror = function(msg, url, line, col, error) {
            alert("Global Error: " + msg + "\nIn: " + url + "\nLine: " + line);
            return false;
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
