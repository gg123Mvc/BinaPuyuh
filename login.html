<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Manajemen Peternakan Puyuh</title>
    <link rel="icon" type="image/png" href="./assets/logo-BuNsA154.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script type="module" crossorigin src="./assets/login-DvffvnE-.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/config-_HLYuJBG.js">
  <link rel="modulepreload" crossorigin href="./assets/app-BgDMR-5F.js">
  <link rel="stylesheet" crossorigin href="./assets/style-B0oKYwws.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="login-header">
                <img src="./assets/logo-BuNsA154.png" alt="Puyuh Farm Logo" class="auth-logo">
                <h2 style="margin-bottom: 0.5rem; color: white;">Admin Login</h2>
                <p style="color: var(--dim-text);">Masuk untuk mengelola peternakan</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div style="position: relative;">
                        <input type="email" id="username" class="form-input" placeholder="Masukkan email" style="padding-left: 2.5rem;">
                        <i class="fas fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" class="form-input" placeholder="Masukkan password" style="padding-left: 2.5rem;">
                        <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                    </div>
                </div>

                <div id="error-msg" style="color: var(--error-color); font-size: 0.875rem; margin-bottom: 1rem; display: none;">
                    Username atau password salah!
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">MASUK SEKARANG</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="index.html" style="color: var(--text-secondary); font-size: 0.875rem;">&larr; Kembali ke Beranda</a>
                <br><br>
                <span style="color: #666; font-size: 0.875rem;">Belum punya akun? </span>
                <a href="register.html" style="color: var(--primary-color); font-weight: 600; font-size: 0.875rem;">Daftar disini</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
