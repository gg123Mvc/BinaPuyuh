<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Manajemen Peternakan Puyuh</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="login-header">
                <img src="./assets/logo.png" alt="Puyuh Farm Logo" class="auth-logo">
                <h2 style="margin-bottom: 0.5rem; color: white;">Admin Login</h2>
                <p style="color: var(--dim-text);">Masuk untuk mengelola peternakan</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div style="position: relative;">
                        <input type="email" id="username" class="form-input" placeholder="Masukkan email" style="padding-left: 2.5rem;">
                        <i class="fas fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" class="form-input" placeholder="Masukkan password" style="padding-left: 2.5rem;">
                        <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                    </div>
                </div>

                <div id="error-msg" style="color: var(--error-color); font-size: 0.875rem; margin-bottom: 1rem; display: none;">
                    Username atau password salah!
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">MASUK SEKARANG</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="index.html" style="color: var(--text-secondary); font-size: 0.875rem;">&larr; Kembali ke Beranda</a>
                <br><br>
                <span style="color: #666; font-size: 0.875rem;">Belum punya akun? </span>
                <a href="register.html" style="color: var(--primary-color); font-weight: 600; font-size: 0.875rem;">Daftar disini</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/app.js?v=2"></script>
    <script>
        window.onload = function() {
            if (typeof Auth === 'undefined') {
                const errorMsg = 'CRITICAL: "Auth" class is not defined. \n\nPossibilities:\n1. js/app.js failed to load (Check Network Tab)\n2. js/app.js has a syntax error (Check Console)\n3. js/config.js is missing or invalid';
                console.error(errorMsg);
                alert(errorMsg);
                document.getElementById('error-msg').innerText = "System Error: Failed to load Application Logic.";
                document.getElementById('error-msg').style.display = 'block';
                document.querySelector('button[type="submit"]').disabled = true;
                return;
            }
            
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                // ... (rest of the logic)

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Disable button during process
            submitBtn.disabled = true;
            submitBtn.innerText = 'MEMPROSES...';

            try {
                const success = await Auth.login(user, pass);
                if (success) {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                errorDiv.innerText = err.message || 'Login gagal'; // Show specific message
                errorDiv.style.display = 'block';
                // Shake effect
                const card = document.querySelector('.auth-card');
                card.style.transform = 'translateX(5px)';
                setTimeout(() => card.style.transform = 'translateX(-5px)', 50);
                setTimeout(() => card.style.transform = 'translate(0)', 100);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'MASUK SEKARANG';
            }
        });
        };
    </script>
</body>
</html>
