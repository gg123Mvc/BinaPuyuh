<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Login - Puyuh Farm</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .verify-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
            text-align: center;
        }
        .verify-card {
            background: white;
            padding: 3rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .spinner {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="verify-container">
        <div class="verify-card">
            <div id="loading">
                <i class="fas fa-circle-notch spinner"></i>
                <h2 style="color: #333; margin-bottom: 0.5rem;">Memverifikasi...</h2>
                <p style="color: #666;">Mohon tunggu sebentar, kami sedang mengarahkan Anda.</p>
            </div>
            
            <div id="error" style="display: none;">
                <i class="fas fa-times-circle" style="font-size: 3rem; color: var(--error-color); margin-bottom: 1rem;"></i>
                <h2 style="color: #333; margin-bottom: 0.5rem;">Gagal Verifikasi</h2>
                <p id="error-text" style="color: #666; margin-bottom: 1.5rem;">Link tidak valid atau kadaluarsa.</p>
                <a href="login.html" class="btn btn-primary">Kembali ke Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/config.js"></script>
    <script type="module" src="./js/app.js"></script>
    <script type="module">
        document.addEventListener('DOMContentLoaded', async () => {
            const sb = window.supabaseClient;
            
            // Supabase automatically handles the hash fragment (#access_token=...)
            // We just need to check if we have a session.
            
            // Give Supabase a moment to process the hash
            // Give Supabase a moment to process the hash
            setTimeout(async () => {
                const { data } = await sb.auth.getSession();
    
                if (data.session) {
                    // Check if Admin
                    try {
                         // Check role manually since "auth" is done but we want to be sure
                        const { data: admin, error: adminError } = await sb
                            .from('admins')
                            .select('role')
                            .eq('id', data.session.user.id)
                            .single();

                        if (admin && admin.role === 'admin') {
                            sessionStorage.setItem('IS_LOGGED_IN', 'true');
                            sessionStorage.setItem('USER_DATA', JSON.stringify(data.session.user));
                            window.location.href = 'dashboard.html';
                        } else {
                            throw new Error('Akun Anda belum disetujui sebagai Admin.');
                        }

                    } catch (e) {
                         showError(e.message);
                         await sb.auth.signOut();
                    }
                } else {
                    // If no session found immediately, listen for auth state change
                    // (Sometimes needed for magic links flow)
                    const { data: { subscription } } = sb.auth.onAuthStateChange(async (event, session) => {
                        if (event === 'SIGNED_IN' && session) {
                            window.location.href = 'dashboard.html';
                        } else if (event === 'os' || !session) { // Auth error or no session
                             // Wait a bit more, if still nothing, show error
                             setTimeout(() => {
                                 if (!sessionStorage.getItem('IS_LOGGED_IN')) showError('Link tidak valid atau kadaluarsa.');
                             }, 3000);
                        }
                    });
                }
            }, 1000);
        });

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-text').innerText = msg;
        }
    </script>
</body>
</html>
